<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login — CogniLoad</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0f0a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(34,197,94,0.08) 0%, transparent 70%);
            top: -100px; left: -100px;
            pointer-events: none;
        }
        body::after {
            content: '';
            position: absolute;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(34,197,94,0.05) 0%, transparent 70%);
            bottom: -50px; right: -50px;
            pointer-events: none;
        }
        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        .logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .logo-icon {
            width: 52px; height: 52px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin-bottom: 12px;
            box-shadow: 0 0 30px rgba(34,197,94,0.3);
        }
        .logo h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo p {
            color: #4b5563;
            font-size: 13px;
            margin-top: 4px;
        }
        .card {
            background: #111711;
            border: 1px solid #1f2d1f;
            border-radius: 20px;
            padding: 36px;
        }
        .card h2 {
            color: #f9fafb;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .card .subtitle {
            color: #4b5563;
            font-size: 13px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            color: #9ca3af;
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            background: #0d130d;
            border: 1px solid #1f2d1f;
            border-radius: 10px;
            padding: 12px 16px;
            color: #f9fafb;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #22c55e; }
        input::placeholder { color: #374151; }
        .btn {
            width: 100%;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
            box-shadow: 0 4px 20px rgba(34,197,94,0.25);
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .divider {
            text-align: center;
            color: #374151;
            font-size: 12px;
            margin: 20px 0;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #1f2d1f;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .link-btn {
            width: 100%;
            background: transparent;
            border: 1px solid #1f2d1f;
            border-radius: 10px;
            padding: 12px;
            color: #9ca3af;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: block;
            transition: border-color 0.2s, color 0.2s;
        }
        .link-btn:hover { border-color: #22c55e; color: #22c55e; }
        .error {
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: #f87171;
            font-size: 13px;
            margin-bottom: 18px;
        }
        .success {
            background: rgba(34,197,94,0.1);
            border: 1px solid rgba(34,197,94,0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: #4ade80;
            font-size: 13px;
            margin-bottom: 18px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <div class="logo-icon">🧠</div>
        <h1>CogniLoad</h1>
        <p>Cognitive Load Estimation System</p>
    </div>
    <div class="card">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your account to continue</p>

        <div class="error" th:if="${error}" th:text="${error}"></div>
        <div class="success" th:if="${param.registered}">Account created! Please sign in.</div>

        <form action="/login" method="post">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@example.com" required/>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required/>
            </div>
            <button type="submit" class="btn">Sign In →</button>
        </form>

        <div class="divider">or</div>
        <a href="/signup" class="link-btn">Create new account</a>
    </div>
</div>
</body>
</html>
