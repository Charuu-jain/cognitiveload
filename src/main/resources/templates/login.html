<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>CogniLoad — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#1f1f1f;--border2:#2a2a2a;--text:#ededed;--muted:#888;--muted2:#444;--green:#00ff88;--cyan:#00d4ff}
html,body{height:100%;font-family:'Geist','Inter',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.orb{position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(0,255,136,0.05) 0%,transparent 60%);top:-150px;right:-150px;pointer-events:none;z-index:0}
.orb2{position:fixed;width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,255,0.04) 0%,transparent 60%);bottom:-100px;left:-100px;pointer-events:none;z-index:0}
.top-bar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--green),var(--cyan));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px}
.brand-name{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.3px}
.top-right{font-size:13px;color:var(--muted)}
.top-right a{color:var(--text);text-decoration:none;font-weight:500}
.top-right a:hover{text-decoration:underline}
.page{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.box{width:100%;max-width:380px}
.box-head{margin-bottom:28px}
.box-head h1{font-size:22px;font-weight:600;color:var(--text);letter-spacing:-.5px;margin-bottom:6px}
.box-head p{font-size:14px;color:var(--muted);line-height:1.5}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:14px}
.field{margin-bottom:14px}
.field:last-of-type{margin-bottom:0}
label{display:block;font-size:13px;font-weight:500;color:var(--text);margin-bottom:6px}
input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:10px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border-color .15s}
input:focus{border-color:#444}
input::placeholder{color:var(--muted2)}
.btn{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:18px;transition:opacity .15s}
.btn:hover{opacity:.88}
.div{display:flex;align-items:center;gap:10px;margin:14px 0}
.div-line{flex:1;height:1px;background:var(--border)}
.div-text{font-size:12px;color:var(--muted2)}
.btn-g{display:block;width:100%;background:transparent;border:1px solid var(--border2);border-radius:8px;padding:10px 16px;color:var(--muted);font-size:14px;font-family:inherit;cursor:pointer;text-align:center;text-decoration:none;transition:all .15s}
.btn-g:hover{border-color:#444;color:var(--text)}
.alert{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px}
.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);color:#fca5a5}
.ok{background:rgba(0,255,136,.06);border:1px solid rgba(0,255,136,.15);color:#6ee7b7}
.foot{margin-top:20px;text-align:center;font-size:12px;color:var(--muted2);line-height:1.6}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--text)}
</style>
</head>
<body>
<div class="orb"></div><div class="orb2"></div>
<div class="top-bar">
  <a href="/" class="brand">
    
    <span class="brand-name">CogniLoad</span>
  </a>
  <div class="top-right">Don't have an account? <a href="/signup">Sign up</a></div>
</div>
<div class="page">
  <div class="box">
    <div class="box-head">
      <h1>Welcome back</h1>
      <p>Sign in to your CogniLoad account to continue.</p>
    </div>
    <div class="alert err" th:if="${error}"><span>⚠</span><span th:text="${error}"></span></div>
    <div class="alert ok" th:if="${param.registered}"><span>✓</span><span>Account created. Sign in to continue.</span></div>
    <div class="alert ok" th:if="${param.verified}"><span>✓</span><span>Email verified. You can now sign in.</span></div>
    <div class="card">
      <form action="/login" method="post">
        <div class="field">
          <label>Email address</label>
          <input type="email" name="email" placeholder="you@example.com" required/>
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" placeholder="Your password" required/>
        </div>
        <button type="submit" class="btn">Continue →</button>
      </form>
    </div>
    <div class="div"><div class="div-line"></div><span class="div-text">or</span><div class="div-line"></div></div>
    <a href="/signup" class="btn-g">Create an account</a>
    <div class="foot">By continuing you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.</div>
  </div>
</div>
</body>
</html>
