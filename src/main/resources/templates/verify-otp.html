<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>CogniLoad — Verify Email</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#1f1f1f;--border2:#2a2a2a;--text:#ededed;--muted:#888;--muted2:#444;--green:#00ff88;--cyan:#00d4ff}
html,body{height:100%;font-family:'Geist','Inter',sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.orb{position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(0,255,136,0.05) 0%,transparent 60%);top:-150px;right:-150px;pointer-events:none;z-index:0}
.orb2{position:fixed;width:400px;height:400px;background:radial-gradient(circle,rgba(0,212,255,0.04) 0%,transparent 60%);bottom:-100px;left:-100px;pointer-events:none;z-index:0}
.top-bar{position:relative;z-index:2;display:flex;align-items:center;padding:16px 32px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none}
.brand img{height:28px;width:auto}
.brand-name{font-size:15px;font-weight:600;color:var(--text);letter-spacing:-.3px}
.page{position:relative;z-index:1;flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.box{width:100%;max-width:380px}
.box-head{margin-bottom:28px}
.box-head h1{font-size:22px;font-weight:600;color:var(--text);letter-spacing:-.5px;margin-bottom:6px}
.box-head p{font-size:14px;color:var(--muted);line-height:1.5}
.email-chip{display:inline-block;background:var(--surface);border:1px solid var(--border2);border-radius:6px;padding:3px 10px;font-size:13px;color:var(--text);margin-top:4px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:14px}
.otp-label{font-size:13px;font-weight:500;color:var(--text);margin-bottom:10px}
.otp-row{display:flex;gap:8px}
.otp-row input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:0;height:52px;color:var(--green);font-size:22px;font-weight:600;text-align:center;font-family:inherit;outline:none;transition:border-color .15s;caret-color:var(--green)}
.otp-row input:focus{border-color:#444}
.btn{width:100%;background:var(--text);color:var(--bg);border:none;border-radius:8px;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;margin-top:18px;transition:opacity .15s}
.btn:hover{opacity:.88}
.alert{border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px;display:flex;align-items:flex-start;gap:8px}
.err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.18);color:#fca5a5}
.foot{margin-top:16px;text-align:center;font-size:13px;color:var(--muted2)}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--text)}
@media (max-width: 480px) {
  .top-bar { padding: 14px 16px; }
  .page { padding: 32px 16px; }
  .card { padding: 18px; }
  .otp-row input { height: 44px; font-size: 18px; }
}
</style>
</head>

    <div class="box-head">
      <h1>Check your email</h1>
      <p>We sent a 6-digit code to<br/>
        <span class="email-chip" th:text="${email}">email@example.com</span>
      </p>

    <div class="card">
      <div class="otp-label">Verification code</div>
      <form action="/verify-otp" method="post">
        <div class="otp-row">
          <input type="text" maxlength="1" id="o1" name="d1" autofocus oninput="moveNext(this,'o2')"/>
          <input type="text" maxlength="1" id="o2" name="d2" oninput="moveNext(this,'o3')"/>
          <input type="text" maxlength="1" id="o3" name="d3" oninput="moveNext(this,'o4')"/>
          <input type="text" maxlength="1" id="o4" name="d4" oninput="moveNext(this,'o5')"/>
          <input type="text" maxlength="1" id="o5" name="d5" oninput="moveNext(this,'o6')"/>
          <input type="text" maxlength="1" id="o6" name="d6"/>
        </div>
        <input type="hidden" name="otp" id="otpFull"/>
        <button type="submit" class="btn" onclick="combineOTP()">Verify email →</button>
      </form>
    </div>
    <div class="foot"><a href="/signup">← Back to sign up</a></div>
  </div>

<script>
function moveNext(c,n){if(c.value.length===1)document.getElementById(n)?.focus()}
function combineOTP(){const d=['d1','d2','d3','d4','d5','d6'].map(n=>document.querySelector('[name="'+n+'"]').value).join('');document.getElementById('otpFull').value=d}
</script>
