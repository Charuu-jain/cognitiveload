<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verify Email — CogniLoad</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif;
            background:#0a0f0a; min-height:100vh;
            display:flex; align-items:center;
            justify-content:center;
        }
        .container { width:100%; max-width:420px; padding:20px; }
        .logo { text-align:center; margin-bottom:32px; }
        .logo-icon {
            width:52px; height:52px;
            background:linear-gradient(135deg,#22c55e,#16a34a);
            border-radius:14px; display:inline-flex;
            align-items:center; justify-content:center;
            font-size:24px; margin-bottom:12px;
            box-shadow:0 0 30px rgba(34,197,94,0.3);
        }
        .logo h1 { color:#fff; font-size:22px; font-weight:700; }
        .logo p { color:#4b5563; font-size:13px; margin-top:4px; }
        .card {
            background:#111711; border:1px solid #1f2d1f;
            border-radius:20px; padding:36px;
        }
        .card h2 { color:#f9fafb; font-size:20px; font-weight:600; margin-bottom:6px; }
        .card .subtitle { color:#4b5563; font-size:13px; margin-bottom:8px; }
        .email-badge {
            background:rgba(34,197,94,0.08);
            border:1px solid rgba(34,197,94,0.15);
            border-radius:8px; padding:8px 14px;
            color:#4ade80; font-size:13px;
            margin-bottom:24px; display:inline-block;
        }
        .otp-inputs {
            display:flex; gap:10px;
            justify-content:center; margin-bottom:24px;
        }
        .otp-inputs input {
            width:48px; height:56px;
            background:#0d130d;
            border:1px solid #1f2d1f;
            border-radius:10px;
            color:#f9fafb; font-size:22px;
            font-weight:700; text-align:center;
            font-family:'Inter',sans-serif;
            outline:none;
            transition:border-color 0.2s;
        }
        .otp-inputs input:focus { border-color:#22c55e; }
        .btn {
            width:100%;
            background:linear-gradient(135deg,#22c55e,#16a34a);
            color:white; border:none; border-radius:10px;
            padding:13px; font-size:15px; font-weight:600;
            font-family:'Inter',sans-serif; cursor:pointer;
            box-shadow:0 4px 20px rgba(34,197,94,0.25);
            transition:opacity 0.2s;
        }
        .btn:hover { opacity:0.9; }
        .error {
            background:rgba(239,68,68,0.1);
            border:1px solid rgba(239,68,68,0.2);
            border-radius:8px; padding:10px 14px;
            color:#f87171; font-size:13px; margin-bottom:18px;
        }
        .back {
            display:block; text-align:center;
            color:#4b5563; font-size:13px;
            text-decoration:none; margin-top:16px;
        }
        .back:hover { color:#22c55e; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <div class="logo-icon">🧠</div>
        <h1>CogniLoad</h1>
        <p>Cognitive Load Estimation System</p>
    </div>
    <div class="card">
        <h2>Verify your email</h2>
        <p class="subtitle">We sent a 6-digit code to</p>
        <span class="email-badge" th:text="${email}">
            email@example.com
        </span>

        <div class="error"
             th:if="${error}" th:text="${error}">
        </div>

        <form action="/verify-otp" method="post">
            <div class="otp-inputs">
                <input type="text" maxlength="1"
                       id="o1" name="d1" autofocus
                       oninput="moveNext(this,'o2')"/>
                <input type="text" maxlength="1"
                       id="o2" name="d2"
                       oninput="moveNext(this,'o3')"/>
                <input type="text" maxlength="1"
                       id="o3" name="d3"
                       oninput="moveNext(this,'o4')"/>
                <input type="text" maxlength="1"
                       id="o4" name="d4"
                       oninput="moveNext(this,'o5')"/>
                <input type="text" maxlength="1"
                       id="o5" name="d5"
                       oninput="moveNext(this,'o6')"/>
                <input type="text" maxlength="1"
                       id="o6" name="d6"/>
            </div>
            <!-- Hidden field combines all digits -->
            <input type="hidden" name="otp" id="otpFull"/>
            <button type="submit" class="btn"
                    onclick="combineOTP()">
                Verify Email →
            </button>
        </form>
        <a href="/signup" class="back">← Back to signup</a>
    </div>
</div>
<script>
    function moveNext(current, nextId) {
        if (current.value.length === 1) {
            document.getElementById(nextId)?.focus();
        }
    }
    function combineOTP() {
        const digits = ['d1','d2','d3','d4','d5','d6']
            .map(n => document.querySelector(
                `[name="${n}"]`).value).join('');
        document.getElementById('otpFull').value = digits;
    }
</script>
</body>
</html>
